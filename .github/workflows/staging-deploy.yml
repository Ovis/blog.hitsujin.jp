name: Deploy Staging

on:
  repository_dispatch:
    types:
      - staging
      - close-staging

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy staging
    if: github.event.action == 'staging'
    runs-on: ubuntu-latest

    concurrency:
      group: oembed-cache
      cancel-in-progress: false

    steps:
      - name: Set timezone
        run: sudo timedatectl set-timezone Asia/Tokyo

      - name: Checkout site repository
        uses: actions/checkout@v7

      - name: Checkout article repository
        uses: actions/checkout@v7
        with:
          repository: Ovis/blog.hitsujin.jp.article
          ref: ${{ github.event.client_payload.branch }}
          path: input

      - name: Check oEmbed cache branch
        id: oembed-cache
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/oembed-cache > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout oEmbed cache
        if: steps.oembed-cache.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: oembed-cache
          path: .oembed-cache

      - name: Initialize oEmbed cache branch
        if: steps.oembed-cache.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            .oembed-cache

          cd .oembed-cache

          git switch --orphan oembed-cache
          git rm -rf --ignore-unmatch .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          touch .gitkeep

          git add .gitkeep

          git commit -m "Initialize oEmbed cache"
          git push --set-upstream origin oembed-cache

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install BlogGenerator
        run: dotnet tool install --global eSheepDev.BlogGenerator

      - name: Generate blog
        run: |
          bloggen \
            --input ./input \
            --output ./output \
            --theme ./templates \
            --oembed ./.oembed-cache/oembed.json \
            --config ./blogconfig.json

      - name: Update oEmbed cache
        working-directory: ./.oembed-cache
        run: |
          if [ -z "$(git status --porcelain -- oembed.json)" ]; then
            echo "oEmbed cache is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add oembed.json
          git commit -m "Update oEmbed cache"
          git push

      - name: Deploy to SWA staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_SMOKE_0628DF600 }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: ./output
          skip_app_build: true
          deployment_environment: staging

  close:
    name: Close staging deployment
    if: github.event.action == 'close-staging'
    runs-on: ubuntu-latest

    steps:
      - name: Close SWA staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_SMOKE_0628DF600 }}
          repo_token: ${{ github.token }}
          action: close
          deployment_environment: staging